
# mode: train
mode: train test test_channel visual visual_proto
# mode: test
# mode: visual
# mode: visual_proto
# mode: test test_channel
# mode: test visual visual_proto
# mode: test_channel visual visual_proto 
batch_size: 128
learning_rate: 0.001
epochs: 3
beta: 0.25
window_size: 100

time_recon:
  patch_size: 10
  patch_stride: 10
  in_dim: 1
  n_hiddens: 64
  n_residual_hiddens: 64
  n_residual_layers: 2
  embedding_dim: 128
  n_embeddings: 64
  activation: gelu
  top_k: 3

freq_recon:
  patch_size: 20
  patch_stride: 20
  in_dim: 1
  n_hiddens: 32
  n_residual_hiddens: 32
  n_residual_layers: 2
  embedding_dim: 128
  n_embeddings: 64
  activation: gelu
  top_k: 3
  
aggregate: mean
topk: 2

log_interval: 50
dataset: MSL.csv

# Boolean flags in YAML use true/false
save: true
filename: msl  # will default to timestamp if empty
visual_channel: [0]

